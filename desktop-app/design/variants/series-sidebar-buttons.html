<!doctype html><meta charset="utf-8"><title>Series sidebar button variants</title>
<style>
:root { --bg:#1F2023; --text:#EDEDEE; --cursor:#EDEDEE; --cursor-text:var(--bg);
  --raised: color-mix(in oklab, var(--bg), var(--text) 6%); --raised2: color-mix(in oklab, var(--bg), var(--text) 10%);
  --rule: color-mix(in oklab, var(--bg), var(--text) 12%); --dim: color-mix(in oklab, var(--bg), var(--text) 36%); --muted: color-mix(in oklab, var(--bg), var(--text) 60%); }
body { margin:0; background:var(--bg); color:var(--text); font: 14px/1.4 -apple-system, "Inter", system-ui, sans-serif; padding: 28px; display:flex; gap:40px; }
.col { width: 240px; } .col h3 { margin:0 0 4px; font-size:13px; font-weight:600; } .col p { margin:0 0 14px; font-size:12px; color:var(--muted); min-height: 60px; }
.poster { width:100%; aspect-ratio: 2/3; max-height: 200px; border-radius:12px; background: linear-gradient(160deg, #c9d3dd, #7a8896); box-shadow: 0 10px 30px rgb(0 0 0 / 30%); }
.stack { display:grid; gap:6px; margin-top:12px; } .stack .btn { width:100%; justify-content:space-between; height:40px; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:0 16px; border:0; border-radius:10px; font: inherit; font-weight:500; background:var(--raised); color:var(--text); }
.btn.primary { background:var(--cursor); color:var(--cursor-text); }
.icon { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon.fill { fill: currentColor; }
/* current */
.cur .btn.on { box-shadow: 0 0 0 1px var(--cursor) inset; } .cur .btn:disabled { opacity:.5; }
/* A: plain, icon carries state */
.a .btn:disabled { color: var(--muted); }
/* B: ring for every on-state, never dimmed */
.b .btn.on { box-shadow: 0 0 0 1px var(--cursor) inset; } .b .btn:disabled { opacity: 1; } .b .btn:disabled:not(.on) { opacity: .5; }
/* C: on = lighter tint, no ring */
.c .btn.on { background: var(--raised2); } .c .btn:disabled { color: var(--muted); }
.prefs { margin-top:16px; font-size:12px; color:var(--muted); }
</style>
<script>
const P = { play:'<path d="M8 5.5v13l11-6.5z"/>', bookmark:'<path d="M6 4h12v17l-6-4-6 4z"/>', check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>' };
const icon = (n, fill) => `<svg class="icon ${fill?'fill':''}" viewBox="0 0 24 24">${P[n]}</svg>`;
const col = (cls, title, note, rows) => `<div class="col ${cls}"><h3>${title}</h3><p>${note}</p><div class="poster"></div><div class="stack">${rows.join("")}</div><div class="prefs">Audio · Quality …</div></div>`;
const btn = (label, ic, opts={}) => `<button class="btn ${opts.primary?'primary':''} ${opts.on?'on':''}" ${opts.disabled?'disabled':''}>${label}${icon(ic, opts.fill)}</button>`;
document.write(
  col("cur", "Current", "Three treatments: filled, ring, ring + faded.", [btn("Play Ep 10","play",{primary:true}), btn("Saved","bookmark",{on:true}), btn("All watched","check",{on:true,disabled:true})]) +
  col("a", "A · Plain toggles", "Both secondary buttons stay flat; a filled bookmark and muted text show state. No ring, no fade.", [btn("Play Ep 10","play",{primary:true}), btn("Saved","bookmark",{fill:true}), btn("All watched","check",{disabled:true})]) +
  col("b", "B · Same ring for both", "Keep the ring, apply it to every on-state, and never fade a completed state.", [btn("Play Ep 10","play",{primary:true}), btn("Saved","bookmark",{on:true}), btn("All watched","check",{on:true,disabled:true})]) +
  col("c", "C · Tint, no ring", "On-state is a slightly lighter tint; done-state mutes the text. Ring removed everywhere.", [btn("Play Ep 10","play",{primary:true}), btn("Saved","bookmark",{on:true}), btn("All watched","check",{on:true,disabled:true})])
);
</script>
