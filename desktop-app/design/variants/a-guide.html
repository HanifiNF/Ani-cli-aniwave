<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ani Desktop — Variant A: Guide</title>
<style>
@font-face { font-family: "Schibsted Grotesk"; src: url("fonts/schibsted-grotesk.woff2") format("woff2"); font-weight: 400 700; font-display: block; }

:root {
  --paper: #F5F5F3; --surface: #FFFFFF; --ink: #1A1B1E; --muted: #6F7278; --rule: #DEDFDB;
  --indigo: #2F3E9E; --indigo-tint: #E9ECF8; --danger: #A8392E;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 14px/1.5 "Schibsted Grotesk", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }

.screen { display: none; min-height: 100vh; }
.screen:target { display: block; }
.screen:first-of-type:not(:target) { display: block; }
body:has(.screen:target) .screen:first-of-type:not(:target) { display: none; }

.col { width: 720px; margin: 0 auto; padding: 36px 0 60px; }

/* top row */
.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 44px; }
.wordmark { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.top nav { display: flex; gap: 22px; color: var(--muted); }
.top nav a:hover, .top nav a.here { color: var(--ink); }
.top nav a.here { box-shadow: 0 1px 0 var(--ink); }

/* search */
.search { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; border-bottom: 1.5px solid var(--ink); padding-bottom: 10px; }
.search input { border: 0; background: none; outline: 0; font-size: 26px; font-weight: 500; letter-spacing: -.02em; padding: 0; width: 100%; }
.search input::placeholder { color: #A5A7AC; }
.search input:focus-visible { outline: 0; }
.search:focus-within { border-color: var(--indigo); }
.prefs { display: flex; gap: 6px; color: var(--muted); font-size: 13px; padding-bottom: 5px; }
.prefs button { padding: 3px 8px; border-radius: 6px; }
.prefs button.on { color: var(--indigo); background: var(--indigo-tint); }
.prefs .sep { width: 1px; background: var(--rule); margin: 4px 6px; }

/* sections */
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 40px 0 6px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 24px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--rule); text-align: left; width: 100%; }
.row:last-child { border-bottom: 1px solid var(--rule); }
.row:hover { background: var(--surface); }
.row .title { font-size: 15px; font-weight: 500; }
.row .meta { color: var(--muted); font-size: 13px; min-width: 96px; }
.row .meta.next { color: var(--indigo); }
.row .meta.src { min-width: 60px; text-align: right; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.hint kbd { font: inherit; border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }

/* series */
.back { color: var(--muted); font-size: 13px; }
.back:hover { color: var(--ink); }
h1 { font-size: 30px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; margin: 8px 0 6px; }
.subline { color: var(--muted); display: flex; gap: 18px; align-items: center; }
.subline .save { color: var(--indigo); margin-left: auto; }
.subline .save.saved::before { content: "Saved"; }
.controls { display: flex; align-items: center; gap: 6px; margin-top: 28px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 13px; }
.controls .jump { border: 0; border-bottom: 1px solid var(--rule); background: none; outline: 0; width: 120px; padding: 2px 0; margin-left: auto; color: var(--ink); }
.controls .jump::placeholder { color: #A5A7AC; }
.ep { grid-template-columns: 44px 1fr auto; }
.ep .num, .row .meta { font-variant-numeric: tabular-nums; }
.ep .num { color: var(--muted); }
.ep .state { color: var(--muted); font-size: 13px; }
.ep.watched .num, .ep.watched .title { color: var(--muted); font-weight: 400; }
.ep.next .title { color: var(--indigo); }
.ep.next .state { color: var(--indigo); }
.ep.busy { background: var(--indigo-tint); }
.ep.busy .state { color: var(--indigo); }
.status { margin: 14px 0 0; padding: 12px 14px; border-radius: 6px; background: var(--surface); border: 1px solid var(--rule); display: flex; gap: 12px; align-items: baseline; }
.status b { font-weight: 500; }
.status span { color: var(--muted); }
.status a { color: var(--indigo); margin-left: auto; }

/* settings */
.form { display: grid; gap: 26px; margin-top: 12px; }
.field { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: baseline; padding-top: 18px; border-top: 1px solid var(--rule); }
.field label { font-weight: 500; }
.field small { display: block; color: var(--muted); font-weight: 400; margin-top: 3px; line-height: 1.4; }
.field input, .field select { width: 100%; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 8px 10px; outline: 0; }
.field input:focus, .field select:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-tint); }
.field .choices { display: flex; gap: 6px; }
.field .choices button { padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.field .choices button.on { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-tint); }
.actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 18px; border-top: 1px solid var(--rule); }
.actions button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); }
.actions .primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
</style>
</head>
<body>

<!-- HOME -->
<section class="screen" id="home">
  <div class="col">
    <div class="top">
      <span class="wordmark">Ani</span>
      <nav><a href="#home" class="here">Search</a><a href="#home">Saved</a><a href="#home">Recent</a><a href="#settings">Settings</a></nav>
    </div>

    <form class="search">
      <input placeholder="Search a title" autofocus>
      <div class="prefs">
        <button type="button" class="on">Sub</button><button type="button">Dub</button>
        <span class="sep"></span>
        <button type="button" class="on">Auto</button><button type="button">AniWave</button><button type="button">AniDB</button>
      </div>
    </form>

    <h2>Continue watching</h2>
    <div class="rows">
      <button class="row"><span class="title">Frieren: Beyond Journey's End</span><span class="meta next">Episode 13 next</span><span class="meta">Sub</span><span class="meta src">AniWave</span></button>
      <button class="row"><span class="title">Dandadan</span><span class="meta next">Episode 4 next</span><span class="meta">Dub</span><span class="meta src">AniDB</span></button>
      <button class="row"><span class="title">Delicious in Dungeon</span><span class="meta next">Episode 25 next</span><span class="meta">Sub</span><span class="meta src">AniWave</span></button>
      <button class="row"><span class="title">The Apothecary Diaries</span><span class="meta next">Episode 8 next</span><span class="meta">Sub</span><span class="meta src">AniWave</span></button>
      <button class="row"><span class="title">Vinland Saga Season 2</span><span class="meta next">Episode 20 next</span><span class="meta">Sub</span><span class="meta src">AniDB</span></button>
    </div>
    <p class="hint">Click a title to open the next episode in IINA.</p>
  </div>
</section>

<!-- SERIES -->
<section class="screen" id="series">
  <div class="col">
    <div class="top">
      <a class="back" href="#home">Back to results</a>
      <nav><a href="#home">Search</a><a href="#home">Saved</a><a href="#home">Recent</a><a href="#settings">Settings</a></nav>
    </div>

    <h1>Frieren: Beyond Journey's End</h1>
    <div class="subline"><span>28 episodes</span><span>AniWave</span><button class="save">Save to library</button></div>

    <div class="controls">
      <div class="prefs">
        <button type="button" class="on">Sub</button><button type="button">Dub</button>
        <span class="sep"></span>
        <button type="button" class="on">Best</button><button type="button">1080p</button><button type="button">720p</button><button type="button">480p</button>
      </div>
      <input class="jump" placeholder="Jump to episode">
    </div>

    <div class="rows">
      <button class="row ep watched"><span class="num">1</span><span class="title">Episode 1</span><span class="state">Watched</span></button>
      <button class="row ep watched"><span class="num">2</span><span class="title">Episode 2</span><span class="state">Watched</span></button>
      <button class="row ep watched"><span class="num">3</span><span class="title">Episode 3</span><span class="state">Watched</span></button>
      <button class="row ep watched"><span class="num">11</span><span class="title">Episode 11</span><span class="state">Watched</span></button>
      <button class="row ep watched"><span class="num">12</span><span class="title">Episode 12</span><span class="state">Watched last Tuesday</span></button>
      <button class="row ep busy"><span class="num">13</span><span class="title">Episode 13</span><span class="state">Finding a stream, then opening IINA…</span></button>
      <button class="row ep"><span class="num">14</span><span class="title">Episode 14</span><span class="state"></span></button>
      <button class="row ep"><span class="num">15</span><span class="title">Episode 15</span><span class="state"></span></button>
      <button class="row ep"><span class="num">16</span><span class="title">Episode 16</span><span class="state"></span></button>
      <button class="row ep"><span class="num">17</span><span class="title">Episode 17</span><span class="state"></span></button>
      <button class="row ep"><span class="num">18</span><span class="title">Episode 18</span><span class="state"></span></button>
    </div>
  </div>
</section>

<!-- SETTINGS -->
<section class="screen" id="settings">
  <div class="col">
    <div class="top">
      <a class="back" href="#home">Back</a>
      <nav><a href="#home">Search</a><a href="#home">Saved</a><a href="#home">Recent</a><a href="#settings" class="here">Settings</a></nav>
    </div>

    <h1>Settings</h1>
    <div class="form">
      <div class="field"><label>Media player<small>Command name or full path. On macOS use IINA's bundled iina-cli.</small></label><input value="/Applications/IINA.app/Contents/MacOS/iina-cli"></div>
      <div class="field"><label>Default quality</label><div class="choices"><button class="on">Best</button><button>1080p</button><button>720p</button><button>480p</button><button>360p</button></div></div>
      <div class="field"><label>Default audio</label><div class="choices"><button class="on">Subtitled</button><button>Dubbed</button></div></div>
      <div class="field"><label>Source<small>Auto tries AniWave first, then AniDB.</small></label><div class="choices"><button class="on">Auto</button><button>AniWave</button><button>AniDB</button></div></div>
      <div class="field"><label>AniWave address</label><input value="https://aniwaves.ru"></div>
      <div class="field"><label>AniDB address</label><input value="https://anidb.app"></div>
      <div class="actions"><button>Cancel</button><button class="primary">Save changes</button></div>
    </div>
  </div>
</section>

</body>
</html>
