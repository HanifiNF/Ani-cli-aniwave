name: Desktop checks

on:
  pull_request:
    paths: ['desktop-app/**', '.github/workflows/desktop-checks.yml']
  push:
    paths: ['desktop-app/**', '.github/workflows/desktop-checks.yml']

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  player-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm run test:player:native

  player-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        display: [x11, wayland]
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb openbox weston
      - run: npm ci
      - name: Configure Electron sandbox
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - name: Test player under X11
        if: matrix.display == 'x11'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session bash -c '
            openbox >/tmp/ani-openbox.log 2>&1 &
            trap "kill $!" EXIT
            ANI_PLAYER_NATIVE_TEST=1 node scripts/run-player-integration.cjs --ozone-platform=x11
          '
      - name: Test player under Wayland
        if: matrix.display == 'wayland'
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --use-pixman --width=1280 --height=800 --socket=ani-player-test >/tmp/ani-weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor"; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for attempt in $(seq 1 50); do
            test -S "$XDG_RUNTIME_DIR/ani-player-test" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/ani-player-test"
          WAYLAND_DISPLAY=ani-player-test ANI_PLAYER_NATIVE_TEST=1 dbus-run-session node scripts/run-player-integration.cjs --ozone-platform=wayland
