name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag must be v'+p.version)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: desktop-app/release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag must be v'+p.version)"
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: desktop-app/release/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag must be v'+p.version)"
      - run: npm test
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: desktop-app/release/*.AppImage
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --verify-tag
